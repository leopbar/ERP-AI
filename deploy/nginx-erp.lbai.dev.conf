# /etc/nginx/sites-available/erp.lbai.dev (link em sites-enabled). Certificado emitido pelo certbot.
# Este arquivo é incluído dentro do bloco http do nginx, por isso a zona de limite pode ficar aqui.
limit_req_zone $binary_remote_addr zone=erp_ai_login:1m rate=10r/m;

server {
    listen 80;
    server_name erp.lbai.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name erp.lbai.dev;

    ssl_certificate     /etc/letsencrypt/live/erp.lbai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.lbai.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A interface só envia JSON curto; não há upload de arquivos.
    client_max_body_size 2m;

    access_log /var/log/nginx/erp.lbai.dev.access.log;
    error_log  /var/log/nginx/erp.lbai.dev.error.log;

    # Login: dez tentativas por minuto por IP no nginx, além do limite do próprio backend.
    location = /api/login {
        limit_req zone=erp_ai_login burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API direto no backend. Uma análise pode levar vários minutos; a interface espera até dez.
    location /api/ {
        proxy_pass         http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3091;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
